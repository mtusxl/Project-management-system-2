
services:
  web:
    container_name: backend
    build:
      context: .
      dockerfile: dockerfile
      target: runtime
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - django-backend-net
    environment:
      - PYTHONPATH=/app
      - SECRET_KEY=${SECRET_KEY}
      - SENTRY_DSN=${SENTRY_DSN}


  db:
    image: postgres:17
    container_name: db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dbdata:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - django-backend-net


  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - django-backend-net


  celery:
    container_name: celery
    build:
      context: .
      dockerfile: dockerfile
      target: runtime
    command: sh -c "celery -A Project_Management_System.config.celery worker -l debug"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    networks:
      - django-backend-net
    env_file:
    - .env
    environment:
    - PYTHONPATH=/app
    - SENTRY_DSN=${SENTRY_DSN}
    - DJANGO_SETTINGS_MODULE=Project_Management_System.config.settings.staging





  prometheus:
      image: prom/prometheus
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        - prometheus-data:/prometheus
      ports:
        - "9090:9090"
      networks:
        - django-backend-net
      depends_on:
        - web

  grafana:
      image: grafana/grafana-enterprise
      volumes:
        - grafana-data:/var/lib/grafana
      ports:
        - "3000:3000"
      networks:
        - django-backend-net
      depends_on:
        - prometheus

networks:
  django-backend-net:

volumes:
  dbdata:
  redisdata:
  prometheus-data:
  grafana-data:
